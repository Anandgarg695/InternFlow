spring.application.name=backend
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/internflow
spring.datasource.username=internflow
spring.datasource.password=${DB_PASSWORD:internflow_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Local secrets file (git-ignored). In production, set the JWT_SECRET environment variable instead.
spring.config.import=optional:classpath:application-local.properties
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=60